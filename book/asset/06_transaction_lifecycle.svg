<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">トランザクションのライフサイクル</title>
  <desc id="desc">トランザクションの生成から署名、伝播、検証、ブロック収録、最終確定までの状態遷移</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#666666"/></marker><style>.title{font:700 30px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#111111}.sub{font:500 16px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#444444}.num{font:700 18px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#fff}.head{font:700 18px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#111111}.small{font:500 13px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#444444}.arrow{stroke:#666666;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="675" rx="24" fill="#ffffff"/><text x="55" y="58" class="title">Transaction Lifecycle：送信済みと確定済みは同じではない</text><text x="55" y="88" class="sub">各段階で確認できる事実が増え、最後にConsensus上のFinalityへ到達する</text>

  <path d="M195 265L250 265M390 265L445 265M585 265L640 265M780 265L835 265M975 265L1030 265" class="arrow"/>
  <g transform="translate(55 175)"><rect width="140" height="180" rx="18" fill="#f4f4f4" stroke="#888888" stroke-width="2"/><circle cx="70" cy="36" r="20" fill="#222222"/><text x="70" y="42" text-anchor="middle" class="num">1</text><text x="70" y="78" text-anchor="middle" class="head">生成</text><text x="70" y="106" text-anchor="middle" class="small">宛先・金額</text><text x="70" y="128" text-anchor="middle" class="small">Nonce・Fee</text><text x="70" y="158" text-anchor="middle" class="small">Unsigned</text></g>
  <g transform="translate(250 175)"><rect width="140" height="180" rx="18" fill="#ececec" stroke="#777777" stroke-width="2"/><circle cx="70" cy="36" r="20" fill="#333333"/><text x="70" y="42" text-anchor="middle" class="num">2</text><text x="70" y="78" text-anchor="middle" class="head">署名</text><text x="70" y="106" text-anchor="middle" class="small">秘密鍵で承認</text><text x="70" y="128" text-anchor="middle" class="small">内容を固定</text><text x="70" y="158" text-anchor="middle" class="small">Signed</text></g>
  <g transform="translate(445 175)"><rect width="140" height="180" rx="18" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><circle cx="70" cy="36" r="20" fill="#333333"/><text x="70" y="42" text-anchor="middle" class="num">3</text><text x="70" y="78" text-anchor="middle" class="head">Broadcast</text><text x="70" y="106" text-anchor="middle" class="small">RPC → P2P</text><text x="70" y="128" text-anchor="middle" class="small">未確定Pool</text><text x="70" y="158" text-anchor="middle" class="small">Pending</text></g>
  <g transform="translate(640 175)"><rect width="140" height="180" rx="18" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="2"/><circle cx="70" cy="36" r="20" fill="#555555"/><text x="70" y="42" text-anchor="middle" class="num">4</text><text x="70" y="78" text-anchor="middle" class="head">検証</text><text x="70" y="106" text-anchor="middle" class="small">署名・残高</text><text x="70" y="128" text-anchor="middle" class="small">Nonce・実行</text><text x="70" y="158" text-anchor="middle" class="small">Valid / Reject</text></g>
  <g transform="translate(835 175)"><rect width="140" height="180" rx="18" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><circle cx="70" cy="36" r="20" fill="#222222"/><text x="70" y="42" text-anchor="middle" class="num">5</text><text x="70" y="78" text-anchor="middle" class="head">Block収録</text><text x="70" y="106" text-anchor="middle" class="small">実行結果</text><text x="70" y="128" text-anchor="middle" class="small">Receipt・Event</text><text x="70" y="158" text-anchor="middle" class="small">Success / Fail</text></g>
  <g transform="translate(1030 175)"><rect width="140" height="180" rx="18" fill="#f6f6f6" stroke="#555555" stroke-width="3"/><circle cx="70" cy="36" r="20" fill="#222222"/><text x="70" y="42" text-anchor="middle" class="num">6</text><text x="70" y="78" text-anchor="middle" class="head">Finality</text><text x="70" y="106" text-anchor="middle" class="small">後続Block</text><text x="70" y="128" text-anchor="middle" class="small">または投票</text><text x="70" y="158" text-anchor="middle" class="small">Finalized</text></g>

  <path d="M515 355L515 420" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="425" width="250" height="72" rx="14" fill="#d6d6d6" stroke="#222222" stroke-width="2"/><text x="515" y="454" text-anchor="middle" class="head">長時間Pending</text><text x="515" y="478" text-anchor="middle" class="small">低Fee・Nonce Gap・混雑</text>
  <path d="M710 355L710 420" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/><rect x="660" y="425" width="280" height="72" rx="14" fill="#d6d6d6" stroke="#222222" stroke-width="2"/><text x="800" y="454" text-anchor="middle" class="head">Reject / Revert</text><text x="800" y="478" text-anchor="middle" class="small">無効なら拒否・失敗でもFee消費の場合</text>
  <rect x="95" y="545" width="1010" height="74" rx="16" fill="#fff" stroke="#bdbdbd" stroke-width="2"/><text x="600" y="574" text-anchor="middle" class="head">確認の基本：Tx Hash → Pending → Block収録 → Receipt Status → Confirmation / Finality</text><text x="600" y="601" text-anchor="middle" class="small">「Walletが送信完了と表示した」だけでは、成功も確定も保証されない</text>
</svg>
