<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RollupとBridgeの処理フロー</title>
  <desc id="desc">Layer 2のトランザクションがSequencer、Batch、Proofを経てLayer 1へ確定され、Bridgeが異なるチェーンを接続する流れ</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#666666"/></marker><style>.title{font:700 30px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#111111}.head{font:700 22px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#111111}.label{font:700 16px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#111111}.small{font:500 13px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#444444}.card{fill:#fff;stroke:#bdbdbd;stroke-width:2}.arrow{stroke:#666666;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="675" rx="24" fill="#ffffff"/><text x="55" y="58" class="title">拡張と接続：RollupはL1へ確定し、Bridgeは別のConsensusを結ぶ</text>

  <rect x="45" y="95" width="1110" height="250" rx="22" fill="#f4f4f4" stroke="#888888" stroke-width="2"/><text x="75" y="135" class="head">Rollup：多数のL2 TransactionをまとめてL1へ</text>
  <g><rect x="75" y="180" width="165" height="72" rx="14" class="card"/><text x="158" y="209" text-anchor="middle" class="label">L2 Users</text><text x="158" y="233" text-anchor="middle" class="small">複数Transaction</text><path d="M240 216L310 216" class="arrow"/><rect x="310" y="180" width="185" height="72" rx="14" fill="#e8e8e8" stroke="#222222" stroke-width="2"/><text x="403" y="209" text-anchor="middle" class="label">Sequencer</text><text x="403" y="233" text-anchor="middle" class="small">順序付け・実行</text><path d="M495 216L565 216" class="arrow"/><rect x="565" y="180" width="190" height="72" rx="14" fill="#e5e5e5" stroke="#555555" stroke-width="2"/><text x="660" y="209" text-anchor="middle" class="label">Batch + Data</text><text x="660" y="233" text-anchor="middle" class="small">Fraud / Validity Proof</text><path d="M755 216L825 216" class="arrow"/><rect x="825" y="165" width="280" height="102" rx="16" fill="#e2e2e2" stroke="#222222" stroke-width="3"/><text x="965" y="199" text-anchor="middle" class="label">Layer 1</text><text x="965" y="224" text-anchor="middle" class="small">Data Availability・Proof検証</text><text x="965" y="246" text-anchor="middle" class="small">最終Settlement</text></g>
  <text x="600" y="310" text-anchor="middle" class="small">確認：Sequencer停止時の強制包含、Data取得、Upgrade権限、L1確定までの段階</text>

  <rect x="45" y="375" width="1110" height="245" rx="22" fill="#f5f5f5" stroke="#999999" stroke-width="2"/><text x="75" y="415" class="head">Bridge：資産自体が空間を移動するのではなく、両ChainのStateを連動させる</text>
  <rect x="80" y="460" width="260" height="104" rx="16" fill="#ececec" stroke="#333333" stroke-width="3"/><text x="210" y="493" text-anchor="middle" class="label">Chain A</text><text x="210" y="518" text-anchor="middle" class="small">元資産をLock または Burn</text><text x="210" y="541" text-anchor="middle" class="small">独立したConsensus A</text>
  <path d="M340 512L465 512" class="arrow"/>
  <rect x="465" y="448" width="270" height="128" rx="18" fill="#ededed" stroke="#444444" stroke-width="3"/><text x="600" y="480" text-anchor="middle" class="label">Bridge / Message Verification</text><text x="600" y="505" text-anchor="middle" class="small">Multisig・Light Client・Proof等</text><text x="600" y="528" text-anchor="middle" class="small">FinalityとMessage重複を確認</text><text x="600" y="551" text-anchor="middle" class="small">ここが追加の信頼境界</text>
  <path d="M735 512L860 512" class="arrow"/>
  <rect x="860" y="460" width="260" height="104" rx="16" fill="#dedede" stroke="#444444" stroke-width="3"/><text x="990" y="493" text-anchor="middle" class="label">Chain B</text><text x="990" y="518" text-anchor="middle" class="small">表現TokenをMint</text><text x="990" y="541" text-anchor="middle" class="small">独立したConsensus B</text>
  <text x="600" y="602" text-anchor="middle" class="small">安全性は Chain A・Bridge・Chain B の最も弱い層に制約される</text>
</svg>
