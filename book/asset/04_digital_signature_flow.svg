<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">デジタル署名の生成と検証</title>
  <desc id="desc">送信者が秘密鍵でトランザクションへ署名し、ノードが公開鍵で検証する流れ</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#666666"/></marker>
    <style>.title{font:700 30px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#111111}.sub{font:500 16px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#444444}.head{font:700 21px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#111111}.label{font:600 16px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#111111}.small{font:500 14px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#444444}.card{fill:#fff;stroke:#bdbdbd;stroke-width:2}.arrow{stroke:#666666;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="675" rx="24" fill="#ffffff"/>
  <text x="55" y="58" class="title">デジタル署名：秘密鍵を送らずに「承認」を検証する</text>
  <text x="55" y="88" class="sub">秘密鍵は署名生成にだけ使用し、Networkへ送るのはTransactionと署名値</text>

  <rect x="55" y="130" width="500" height="410" rx="22" fill="#f4f4f4" stroke="#888888" stroke-width="2"/>
  <text x="85" y="170" class="head">送信者・Wallet：Signing</text>
  <rect x="90" y="205" width="190" height="78" rx="14" class="card"/><text x="185" y="235" text-anchor="middle" class="label">Transaction</text><text x="185" y="260" text-anchor="middle" class="small">宛先・金額・Nonce等</text>
  <rect x="330" y="205" width="180" height="78" rx="14" fill="#d6d6d6" stroke="#222222" stroke-width="2"/><text x="420" y="235" text-anchor="middle" class="label">秘密鍵</text><text x="420" y="260" text-anchor="middle" class="small">外部へ送らない</text>
  <path d="M185 283L185 330M420 283L420 330" class="arrow"/>
  <rect x="145" y="332" width="320" height="80" rx="16" fill="#e8e8e8" stroke="#222222" stroke-width="3"/><text x="305" y="365" text-anchor="middle" class="label">署名アルゴリズム</text><text x="305" y="391" text-anchor="middle" class="small">Transaction Hash + 秘密鍵</text>
  <path d="M305 412L305 455" class="arrow"/>
  <rect x="170" y="457" width="270" height="58" rx="14" fill="#e2e2e2" stroke="#222222" stroke-width="3"/><text x="305" y="492" text-anchor="middle" class="label">Transaction + 署名値</text>

  <path d="M555 340L655 340" class="arrow"/>
  <text x="605" y="326" text-anchor="middle" class="small">Broadcast</text>

  <rect x="655" y="130" width="490" height="410" rx="22" fill="#f6f6f6" stroke="#888888" stroke-width="2"/>
  <text x="685" y="170" class="head">Node：Verification</text>
  <rect x="710" y="210" width="380" height="74" rx="14" class="card"/><text x="900" y="240" text-anchor="middle" class="label">Transaction・署名・公開鍵</text><text x="900" y="264" text-anchor="middle" class="small">公開情報だけで検証可能</text>
  <path d="M900 284L900 330" class="arrow"/>
  <rect x="740" y="332" width="320" height="80" rx="16" fill="#e2e2e2" stroke="#222222" stroke-width="3"/><text x="900" y="365" text-anchor="middle" class="label">署名検証</text><text x="900" y="391" text-anchor="middle" class="small">内容変更・鍵の対応を確認</text>
  <path d="M900 412L900 455" class="arrow"/>
  <rect x="735" y="457" width="330" height="58" rx="14" fill="#f0f0f0" stroke="#333333" stroke-width="3"/><text x="900" y="492" text-anchor="middle" class="label">有効なら残高・Nonce等も検証</text>

  <rect x="95" y="575" width="1010" height="62" rx="16" fill="#f5f5f5" stroke="#666666" stroke-width="2"/>
  <text x="600" y="601" text-anchor="middle" class="label">署名が証明する：対応する鍵による承認＋署名後に内容が変わっていないこと</text>
  <text x="600" y="625" text-anchor="middle" class="small">証明しない：現実の身元、内容を理解した意思、端末や表示画面の安全性</text>
</svg>
