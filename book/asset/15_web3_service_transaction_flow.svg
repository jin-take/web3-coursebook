<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Web3サービスとトランザクション追跡</title>
  <desc id="desc">UserからFrontend、Wallet、RPC、P2P、Validator、Smart Contract、State、Indexerを通って画面へ反映されるまで</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#666666"/></marker><style>.title{font:700 30px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#111111}.sub{font:500 15px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#444444}.label{font:700 15px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#111111}.small{font:500 12px system-ui,-apple-system,'Noto Sans JP',sans-serif;fill:#444444}.card{fill:#fff;stroke:#bdbdbd;stroke-width:2}.arrow{stroke:#666666;stroke-width:3;fill:none;marker-end:url(#arrow)}.return{stroke:#222222;stroke-width:3;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="675" rx="24" fill="#ffffff"/><text x="55" y="58" class="title">Web3サービス全体：Userの意図が共有Stateへ反映されるまで</text><text x="55" y="86" class="sub">青：署名済みTransactionの流れ　緑の破線：実行結果が画面へ戻る流れ</text>

  <rect x="45" y="115" width="1110" height="335" rx="22" fill="#f4f4f4" stroke="#888888" stroke-width="2"/>
  <g transform="translate(70 225)"><rect width="125" height="90" rx="16" class="card"/><text x="63" y="35" text-anchor="middle" class="label">1. User</text><text x="63" y="61" text-anchor="middle" class="small">目的・確認・承認</text></g>
  <path d="M195 270L240 270" class="arrow"/>
  <g transform="translate(240 225)"><rect width="135" height="90" rx="16" class="card"/><text x="68" y="35" text-anchor="middle" class="label">2. Frontend</text><text x="68" y="61" text-anchor="middle" class="small">Tx候補を構築</text></g>
  <path d="M375 270L420 270" class="arrow"/>
  <g transform="translate(420 210)"><rect width="145" height="120" rx="16" fill="#ececec" stroke="#333333" stroke-width="3"/><text x="73" y="35" text-anchor="middle" class="label">3. Wallet</text><text x="73" y="61" text-anchor="middle" class="small">内容を表示</text><text x="73" y="82" text-anchor="middle" class="small">秘密鍵で署名</text><text x="73" y="103" text-anchor="middle" class="small">Tx Hash</text></g>
  <path d="M565 270L610 270" class="arrow"/>
  <g transform="translate(610 225)"><rect width="125" height="90" rx="16" class="card"/><text x="63" y="35" text-anchor="middle" class="label">4. RPC Node</text><text x="63" y="61" text-anchor="middle" class="small">受付・Broadcast</text></g>
  <path d="M735 270L780 270" class="arrow"/>
  <g transform="translate(780 225)"><rect width="125" height="90" rx="16" class="card"/><text x="63" y="35" text-anchor="middle" class="label">5. P2P</text><text x="63" y="61" text-anchor="middle" class="small">検証・伝播</text></g>
  <path d="M905 270L950 270" class="arrow"/>
  <g transform="translate(950 210)"><rect width="165" height="120" rx="16" fill="#e5e5e5" stroke="#555555" stroke-width="3"/><text x="83" y="35" text-anchor="middle" class="label">6. Consensus</text><text x="83" y="61" text-anchor="middle" class="small">Validator / Miner</text><text x="83" y="82" text-anchor="middle" class="small">Block収録</text><text x="83" y="103" text-anchor="middle" class="small">Finality</text></g>
  <text x="600" y="150" text-anchor="middle" class="label">Trust Boundary：Frontend表示、Wallet署名、RPC応答、Consensusを層ごとに検証</text>

  <path d="M1033 330L1033 495" class="arrow"/>
  <g transform="translate(860 495)"><rect width="255" height="95" rx="16" fill="#e2e2e2" stroke="#222222" stroke-width="3"/><text x="128" y="31" text-anchor="middle" class="label">7. Smart Contract実行</text><text x="128" y="55" text-anchor="middle" class="small">Code + 旧State → 新State</text><text x="128" y="77" text-anchor="middle" class="small">Receipt・Event</text></g>
  <path d="M860 543L745 543" class="return"/>
  <g transform="translate(560 495)"><rect width="185" height="95" rx="16" fill="#f5f5f5" stroke="#333333" stroke-width="2"/><text x="93" y="31" text-anchor="middle" class="label">8. Indexer / Explorer</text><text x="93" y="55" text-anchor="middle" class="small">Eventを索引化</text><text x="93" y="77" text-anchor="middle" class="small">On-chain結果を表示</text></g>
  <path d="M560 543L420 543L308 315" class="return"/>
  <rect x="70" y="495" width="405" height="95" rx="16" fill="#fff" stroke="#bdbdbd" stroke-width="2"/><text x="273" y="527" text-anchor="middle" class="label">調査の起点：Tx Hash</text><text x="273" y="552" text-anchor="middle" class="small">Receipt Status → Block → Event → State差分</text><text x="273" y="574" text-anchor="middle" class="small">画面不更新時はIndexer / Cacheを切り分ける</text>
  <text x="600" y="633" text-anchor="middle" class="label">「Walletの表示」と「Blockchain上の事実」を、Tx Hashで接続して検証する</text>
</svg>
